# Pinned Maven distribution for backend builds. No floating versions.
# If mvnw / mvnw.cmd binaries are absent (wrapper jar not generated), either:
#   1) install Maven 3.9+ and use `mvn` in place of `./mvnw`, or
#   2) run `mvn -N wrapper:wrapper -Dmaven=3.9.9` once with network access.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionSha256Sum=
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
