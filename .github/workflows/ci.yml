# Phase 1d — CI + deployment skeleton verification (no secrets, no purchases).
# Triggers on push/PR. No secrets required: frontend build/test, backend pure-unit
# tests (no DB), and contracts check are all hermetic.
name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run test --prefix frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -DskipTests package --file backend/pom.xml
      # Pure unit, no DB: ScoringServiceTest + JwtVerifierTest + InsightsServiceTest.
      # failIfNoSpecifiedTests=false keeps the job green if a listed test is absent.
      - run: >-
          mvn -B -Dtest=ScoringServiceTest,JwtVerifierTest,InsightsServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false test --file backend/pom.xml

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-contracts.mjs
